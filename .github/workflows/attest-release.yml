name: Attest Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose Skill tarball will be attested
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Download immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Attest Skill archive
        if: ${{ ! github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/repo-curator-skill-*.tar.gz
      - name: Record unavailable hosted attestation
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice::GitHub artifact attestations are unavailable for user-owned private repositories"
          echo "HOSTED_ATTESTATION_UNAVAILABLE_PRIVATE_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
