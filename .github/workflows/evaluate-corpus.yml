name: Evaluate Corpus

on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: Repository-relative path to an immutable v2 corpus bundle
        required: true
        default: evaluation-corpus

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"
      - name: Verify corpus artifacts
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
        run: |
          test -d "$CORPUS_PATH"
          python3 -m repo_curator corpus-verify \
            --cases "$CORPUS_PATH/gold-cases.json" \
            --risk-cases "$CORPUS_PATH/mutation-risk-cases.json" \
            --reviewer-registry "$CORPUS_PATH/reviewer-provenance.json" \
            --artifact-ledger "$CORPUS_PATH/artifact-ledger.json" \
            --artifact-root "$CORPUS_PATH/artifacts" \
            --output "$RUNNER_TEMP/artifact-verification.json"
      - name: Evaluate admission gates
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
        run: |
          python3 -m repo_curator evaluate \
            --cases "$CORPUS_PATH/gold-cases.json" \
            --risk-cases "$CORPUS_PATH/mutation-risk-cases.json" \
            --manifest "$CORPUS_PATH/corpus-manifest.json" \
            --artifact-ledger "$CORPUS_PATH/artifact-ledger.json" \
            --artifact-root "$CORPUS_PATH/artifacts" \
            --created-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "$RUNNER_TEMP/admission-report.json"
      - name: Publish descriptive calibration slices
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
        run: |
          python3 -m repo_curator calibrate \
            --cases "$CORPUS_PATH/gold-cases.json" \
            --risk-cases "$CORPUS_PATH/mutation-risk-cases.json" \
            --manifest "$CORPUS_PATH/corpus-manifest.json" \
            --created-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "$RUNNER_TEMP/calibration-report.json"
      - name: Retain corpus evaluation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-evaluation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/artifact-verification.json
            ${{ runner.temp }}/admission-report.json
            ${{ runner.temp }}/calibration-report.json
